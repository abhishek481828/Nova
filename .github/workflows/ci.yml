name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libasound2-dev portaudio19-dev libportaudio2 libpulse-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt || true
        pip install -r requirements-voice.txt || true
        pip install pytest pytest-asyncio pytest-mock

    - name: Run Companion Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest nova/tests/companion/ -v
